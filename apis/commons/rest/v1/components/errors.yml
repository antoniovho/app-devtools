---
# Shared Problem Details responses for all API products.
#
# Based on RFC 9457 (Problem Details for HTTP APIs),
# which obsoletes RFC 7807.
#
# All API errors use:
#   Content-Type: application/problem+json

components:
  schemas:
    ErrorDetails:
      title: ErrorDetails
      type: object

      # Deliberately not using additionalProperties: false.
      # Problem Details allows problem-specific extension members.

      required:
        - status
        - title
        - detail

      properties:
        type:
          type: string
          format: uri-reference
          description: >
            URI reference identifying the problem type.
            When omitted, "about:blank" is assumed.
          default: about:blank
          example: /problems/invalid-request

        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: >
            HTTP status code generated by the server for this occurrence
            of the problem.
          example: 400

        title:
          type: string
          maxLength: 1000
          description: >
            Short, human-readable summary of the problem type.
            It should remain stable across occurrences of the same problem.
          example: Bad Request

        detail:
          type: string
          maxLength: 5000
          description: >
            Human-readable explanation specific to this occurrence
            of the problem.
          example: The request is invalid.

        instance:
          type: string
          format: uri-reference
          description: >
            URI reference identifying this specific occurrence of the problem.
            It may be used to correlate the response with logs or traces.
          example: /errors/01K5A8F7Q


  responses:
    BadRequest400:
      description: The request is invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorDetails"
          example:
            type: /problems/bad-request
            status: 400
            title: Bad Request
            detail: The request is invalid.

    Unauthorized401:
      description: Authentication is required or failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorDetails"
          example:
            type: /problems/unauthorized
            status: 401
            title: Unauthorized
            detail: Authentication is required or the credentials are invalid.

    Forbidden403:
      description: The authenticated principal is not allowed to perform the operation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorDetails"
          example:
            type: /problems/forbidden
            status: 403
            title: Forbidden
            detail: The authenticated principal lacks the required permission.

    NotFound404:
      description: The requested resource was not found.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorDetails"
          example:
            type: /problems/not-found
            status: 404
            title: Not Found
            detail: The requested resource was not found.

    Conflict409:
      description: The operation conflicts with the current state of the resource.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorDetails"
          example:
            type: /problems/conflict
            status: 409
            title: Conflict
            detail: The resource state conflicts with this operation.

    UnprocessableEntity422:
      description: The request is syntactically valid but violates a domain rule.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorDetails"
          example:
            type: /problems/domain-validation
            status: 422
            title: Unprocessable Entity
            detail: The request violates a domain rule.

    InternalServerError500:
      description: An unexpected server error occurred.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorDetails"
          example:
            type: /problems/internal-server-error
            status: 500
            title: Internal Server Error
            detail: An unexpected server error occurred.

    BadGateway502:
      description: An upstream dependency returned an invalid response.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorDetails"
          example:
            type: /problems/upstream-error
            status: 502
            title: Bad Gateway
            detail: An upstream dependency returned an invalid response.

    ServiceUnavailable503:
      description: The service is temporarily unavailable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorDetails"
          example:
            type: /problems/service-unavailable
            status: 503
            title: Service Unavailable
            detail: The service is temporarily unavailable.

    GatewayTimeout504:
      description: An upstream dependency did not respond in time.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorDetails"
          example:
            type: /problems/upstream-timeout
            status: 504
            title: Gateway Timeout
            detail: An upstream dependency did not respond in time.

    UnexpectedStatusCode520:
      description: An unexpected status code was received.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorDetails"
          example:
            type: /problems/unexpected-status-code
            status: 520
            title: Unexpected Status Code
            detail: An unexpected status code was received.

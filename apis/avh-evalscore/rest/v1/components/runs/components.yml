---
components:
  parameters:
    EvaluationRunSortBy:
      name: sortBy
      in: query
      description: Field used to order evaluation runs.
      schema:
        $ref: '#/components/schemas/EvaluationRunSortBy'
    EvaluationRunStatusFilter:
      name: status
      in: query
      description: Return only runs in this lifecycle state.
      schema:
        $ref: '#/components/schemas/EvaluationRunStatus'
    EvaluationResultSortBy:
      name: sortBy
      in: query
      description: Field used to order evaluation results.
      schema:
        $ref: '#/components/schemas/EvaluationResultSortBy'
    EvaluationResultPassedFilter:
      name: passed
      in: query
      description: Return only passing or failing result attempts.
      schema:
        $ref: '#/components/schemas/EvaluationResultPassedFilter'
    EvaluationResultCaseIdFilter:
      name: caseId
      in: query
      description: Return only result attempts for this evaluation case.
      schema:
        $ref: ../common/components.yml#/components/schemas/UUID
    EvaluationResultMinScoreFilter:
      name: minScore
      in: query
      description: Inclusive lower score bound.
      schema:
        $ref: '#/components/schemas/EvaluationResultScore'
    EvaluationResultMaxScoreFilter:
      name: maxScore
      in: query
      description: Inclusive upper score bound.
      schema:
        $ref: '#/components/schemas/EvaluationResultScore'
  schemas:
    EvaluationRunStatus:
      title: EvaluationRunStatus
      description: Lifecycle state of an asynchronous evaluation run.
      type: string
      enum: [CREATED, RUNNING, COMPLETED, FAILED, CANCELLED]
      example: COMPLETED
    EvaluationRunSortBy:
      title: EvaluationRunSortBy
      description: Field used to order evaluation runs.
      type: string
      enum: [CREATED_AT, STARTED_AT, FINISHED_AT, STATUS]
      default: CREATED_AT
      example: CREATED_AT
    EvaluationResultSortBy:
      title: EvaluationResultSortBy
      description: Field used to order evaluation results.
      type: string
      enum: [CREATED_AT, SCORE, ATTEMPT]
      default: CREATED_AT
      example: CREATED_AT
    EvaluationResultPassedFilter:
      title: EvaluationResultPassedFilter
      description: Whether an evaluation result attempt passed its configured threshold.
      type: boolean
    EvaluationResultScore:
      title: EvaluationResultScore
      description: A normalized evaluation result score.
      type: number
      minimum: 0
      maximum: 1
    TraceStep:
      type: object
      additionalProperties: false
      required: [kind, input, output, startedAt, finishedAt]
      properties:
        kind:
          $ref: ../common/components.yml#/components/schemas/TraceStepKind
        name:
          type: string
          nullable: true
          minLength: 1
          maxLength: 255
        input:
          type: string
          maxLength: 50000
          nullable: true
        output:
          type: string
          maxLength: 50000
          nullable: true
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties:
            type: string
    EvaluationTrace:
      type: object
      additionalProperties: false
      required: [steps]
      properties:
        steps:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/TraceStep'
    TargetResponseEnvelope:
      type: object
      additionalProperties: false
      required: [output]
      properties:
        output:
          type: string
          maxLength: 50000
        trace:
          $ref: '#/components/schemas/EvaluationTrace'
    EvaluationRun:
      type: object
      additionalProperties: false
      required: [id, evaluationId, status, snapshot, createdAt]
      properties:
        id:
          $ref: ../common/components.yml#/components/schemas/UUID
        evaluationId:
          $ref: ../common/components.yml#/components/schemas/UUID
        status:
          $ref: '#/components/schemas/EvaluationRunStatus'
        snapshot:
          $ref: ../evaluations/components.yml#/components/schemas/Evaluation
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        error:
          type: string
          maxLength: 5000
        results:
          type: array
          description: Persisted result attempts available when the run is retrieved.
          items:
            $ref: '#/components/schemas/EvaluationResult'
    EvaluationResult:
      type: object
      additionalProperties: false
      required: [id, caseId, attempt, score, passed, reasoning, createdAt]
      properties:
        id:
          $ref: ../common/components.yml#/components/schemas/UUID
        caseId:
          $ref: ../common/components.yml#/components/schemas/UUID
        attempt:
          type: integer
          minimum: 1
        output:
          type: string
          maxLength: 50000
          nullable: true
        score:
          $ref: '#/components/schemas/EvaluationResultScore'
        passed:
          $ref: '#/components/schemas/EvaluationResultPassedFilter'
        reasoning:
          type: string
          maxLength: 50000
        trace:
          $ref: '#/components/schemas/EvaluationTrace'
        trajectory:
          $ref: '#/components/schemas/TrajectoryCheck'
        createdAt:
          type: string
          format: date-time
    TrajectoryCheck:
      type: object
      additionalProperties: false
      required: [traceAvailable, passed, missingExpectedSteps, encounteredForbiddenSteps]
      properties:
        traceAvailable:
          type: boolean
          description: Whether the target returned trace evidence for deterministic validation.
        passed:
          type: boolean
          description: Whether all trajectory constraints passed.
        missingExpectedSteps:
          type: array
          items:
            $ref: ../evaluations/components.yml#/components/schemas/TrajectoryStepExpectation
        encounteredForbiddenSteps:
          type: array
          items:
            $ref: ../evaluations/components.yml#/components/schemas/TrajectoryStepExpectation
    EvaluationRunListResponse:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/EvaluationRun'
        pagination:
          $ref: ../common/components.yml#/components/schemas/Pagination
    EvaluationResultListResponse:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/EvaluationResult'
        pagination:
          $ref: ../common/components.yml#/components/schemas/Pagination

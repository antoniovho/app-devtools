area/api:
  - changed-files:
      - any-glob-to-any-file: "apis/**"

area/configuration:
  - changed-files:
      - any-glob-to-any-file:
          - "redocly.yaml"
          - ".vscode/**"

area/github:
  - changed-files:
      - any-glob-to-any-file: ".github/**"

area/security:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/dependabot.yml"
          - ".github/workflows/security-*.yml"

kind/documentation:
  - changed-files:
      - any-glob-to-any-file: "**/*.md"

area/sql:
  - changed-files:
      - any-glob-to-any-file: "**/*.sql"

dependencies:
  - changed-files:
      - any-glob-to-any-file: ".github/dependabot.yml"

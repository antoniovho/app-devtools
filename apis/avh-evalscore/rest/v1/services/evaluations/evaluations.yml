get:
  operationId: listEvaluations
  tags: [Evaluations]
  summary: List evaluations
  description: Returns a paginated list of evaluation definitions available for execution.
  parameters:
    - $ref: ../../components/common/components.yml#/components/parameters/Offset
    - $ref: ../../components/common/components.yml#/components/parameters/Limit
    - $ref: ../../components/common/components.yml#/components/parameters/Order
    - $ref: ../../components/evaluations/components.yml#/components/parameters/EvaluationSortBy
    - $ref: ../../components/evaluations/components.yml#/components/parameters/EvaluationName
    - $ref: ../../components/evaluations/components.yml#/components/parameters/TargetKindFilter
  responses:
    '200':
      description: Evaluations
      content:
        application/json:
          schema:
            $ref: ../../components/evaluations/components.yml#/components/schemas/EvaluationListResponse
    '400':
      $ref: ../../../../../commons/rest/v1/components/errors.yml#/components/responses/BadRequest400
    '401':
      $ref: ../../../../../commons/rest/v1/components/errors.yml#/components/responses/Unauthorized401
    '422':
      $ref: ../../../../../commons/rest/v1/components/errors.yml#/components/responses/UnprocessableEntity422
    '500':
      $ref: ../../../../../commons/rest/v1/components/errors.yml#/components/responses/InternalServerError500
post:
  operationId: createEvaluation
  tags: [Evaluations]
  summary: Create an evaluation
  description: Creates an evaluation definition with a configured target and evaluation engine.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/evaluations/components.yml#/components/schemas/CreateEvaluationRequest
  responses:
    '201':
      description: Evaluation created
      headers:
        Location:
          required: true
          schema:
            type: string
            format: uri-reference
      content:
        application/json:
          schema:
            $ref: ../../components/evaluations/components.yml#/components/schemas/Evaluation
    '400':
      $ref: ../../../../../commons/rest/v1/components/errors.yml#/components/responses/BadRequest400
    '401':
      $ref: ../../../../../commons/rest/v1/components/errors.yml#/components/responses/Unauthorized401
    '422':
      $ref: ../../../../../commons/rest/v1/components/errors.yml#/components/responses/UnprocessableEntity422
    '500':
      $ref: ../../../../../commons/rest/v1/components/errors.yml#/components/responses/InternalServerError500

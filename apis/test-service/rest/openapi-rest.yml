---
openapi: 3.0.3
info:
  title: Test Service
  description: API for authoring immutable test definitions, composing test plans, executing validated plans, and publishing read-only projections to an external testing viewer.
  version: 0.1.4
  contact:
    name: Antonio Velasco Horcajada
    email: avelasco.horcajada@knowmadmood.com
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Authoring
    description: Versioned test cases and preconditions.
  - name: Composition
    description: Versioned test sets and plans.
  - name: Projects
    description: Shared project catalog and administrative lifecycle.
  - name: Execution
    description: Executions and immutable test results.
  - name: Viewer Integration
    description: Outbound publication and drift detection.

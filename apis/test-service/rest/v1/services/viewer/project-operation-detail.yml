get:
  operationId: getProjectViewerOperation
  tags:
    - Viewer Integration
  summary: Get an asynchronous Viewer operation
  description: Retrieves the details of a specific asynchronous Viewer operation within a project.
  parameters:
    - $ref: ../../components/common/components.yml#/components/parameters/projectKeyPath
    - name: viewerOperationId
      in: path
      required: true
      schema:
        $ref: ../../components/common/components.yml#/components/schemas/UUID
  responses:
    "200":
      description: Viewer operation
      content:
        application/json:
          schema:
            $ref: ../../components/viewer/components.yml#/components/schemas/ViewerOperation
    "400":
      $ref: ../../../../../commons/rest/v1/components/errors.yml#/components/responses/BadRequest400
    "401":
      $ref: ../../../../../commons/rest/v1/components/errors.yml#/components/responses/Unauthorized401
    "403":
      $ref: ../../../../../commons/rest/v1/components/errors.yml#/components/responses/Forbidden403
    "404":
      $ref: ../../../../../commons/rest/v1/components/errors.yml#/components/responses/NotFound404
    "500":
      $ref: ../../../../../commons/rest/v1/components/errors.yml#/components/responses/InternalServerError500
    "503":
      $ref: ../../../../../commons/rest/v1/components/errors.yml#/components/responses/ServiceUnavailable503
